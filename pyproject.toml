[project]
name = "livekit-ojin-demo"
version = "0.1.0"
description = "LiveKit agent demo with Ojin avatar plugin"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "livekit-agents>=1.5",
    "livekit-plugins-deepgram>=1.5",
    "livekit-plugins-elevenlabs>=1.5",
    "livekit-plugins-ojin",
    "livekit-plugins-google>=1.5",
    "livekit-plugins-openai>=1.5",
    "livekit-plugins-silero>=1.5",
    "livekit-plugins-noise-cancellation>=0.2.5",
    "python-dotenv>=1.2.1",
]

[tool.uv.sources]
livekit-plugins-ojin = { git = "https://github.com/journee-live/livekit-agents.git", branch = "ojin-agent", subdirectory = "livekit-plugins/livekit-plugins-ojin" }
